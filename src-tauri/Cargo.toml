[package]
name = "ai-diff-review"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
uuid = { version = "1.8", features = ["v4"] }
window-vibrancy = "0.8.1"

[[bin]]
name = "ai-diff-review"
path = "src/main.rs"
